<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaylee Jane | Architectural Leadership</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg-dark: #0A0A;
        --bg-surface: #121212;
        --gold: #C4B59D;
        --gold-hover: #D6C6AD;
        --text-primary: #E8E3D9;
        --text-secondary: #9A9387;
        --accent-line: rgba(196, 181, 157, 0.15);
        --grid-color: rgba(196, 181, 157, 0.03);
        --sepia-overlay: rgba(171, 138, 88, 0.35);
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-primary);
        line-height: 1.6;
        overflow-x: hidden;
        position: relative;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            linear-gradient(var(--grid-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: 0;
        pointer-events: none;
        animation: gridDrift 120s linear infinite;
    }

    @keyframes gridDrift {
        0% { transform: translate(0, 0); }
        100% { transform: translate(40px, 40px); }
    }

    .scanning-line {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        z-index: 9999;
        opacity: 0.3;
        animation: scan 8s linear infinite;
        pointer-events: none;
    }

    @keyframes scan {
        0% { top: 0%; }
        100% { top: 100%; }
    }

    .cursor-parallax {
        position: fixed;
        width: 20px;
        height: 20px;
        border: 1px solid var(--gold);
        border-radius: 50%;
        pointer-events: none;
        z-index: 10000;
        opacity: 0;
        transition: opacity 0.3s ease;
        transform: translate(-50%, -50%);
        mix-blend-mode: difference;
    }

    body:hover .cursor-parallax {
        opacity: 0.5;
    }

    .slow-nodes {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
    }

    .node {
        position: absolute;
        width: 3px;
        height: 3px;
        background: var(--gold);
        border-radius: 50%;
        opacity: 0.15;
        animation: float 60s infinite ease-in-out;
    }

    @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(100px, 50px); }
        50% { transform: translate(-50px, 100px); }
        75% { transform: translate(50px, -50px); }
    }

    nav {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 30px 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        background: linear-gradient(180deg, rgba(10,0.95) 0%, rgba(10,0) 100%);
        backdrop-filter: blur(10px);
        transition: all 0.4s ease;
    }

    nav.scrolled {
        padding: 20px 60px;
        background: rgba(10,10,10,0.98);
        border-bottom: 1px solid var(--accent-line);
    }

    .logo {
        font-family: 'Georgia', serif;
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--gold);
        text-decoration: none;
        transition: opacity 0.3s ease;
    }

    .logo:hover {
        opacity: 0.7;
    }

    .nav-links {
        display: flex;
        gap: 40px;
        list-style: none;
    }

    .nav-links a {
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        transition: color 0.3s ease;
        position: relative;
    }

    .nav-links a::after {
        content: '';
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 0;
        height: 1px;
        background: var(--gold);
        transition: width 0.3s ease;
    }

    .nav-links a:hover {
        color: var(--text-primary);
    }

    .nav-links a:hover::after {
        width: 100%;
    }

    section {
        position: relative;
        z-index: 2;
        padding: 140px 60px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-top: 180px;
        padding-bottom: 100px;
    }

    .hero-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 80px;
        align-items: center;
    }

    .hero-image {
        position: relative;
        overflow: hidden;
        aspect-ratio: 3/4;
    }

    .hero-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: sepia(0.4) contrast(1.1) brightness(0.9);
        transition: transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .hero-image::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--sepia-overlay);
        mix-blend-mode: multiply;
        pointer-events: none;
    }

    .hero-image:hover img {
        transform: scale(1.03);
    }

    h1 {
        font-family: 'Georgia', serif;
        font-size: clamp(42px, 5vw, 72px);
        line-height: 1.1;
        font-weight: 400;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        margin-bottom: 40px;
    }

    .hero-quote {
        font-family: 'Georgia', serif;
        font-size: 24px;
        line-height: 1.5;
        font-style: italic;
        color: var(--text-primary);
        margin-bottom: 0;
        position: relative;
        padding-left: 30px;
        border-left: 2px solid var(--gold);
    }

    .hero-body {
        font-size: 16px;
        line-height: 1.8;
        color: var(--text-secondary);
        max-width: 480px;
        margin-top: 40px;
    }

    .section-label {
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .section-label::before {
        content: '';
        width: 30px;
        height: 1px;
        background: var(--gold);
    }
